<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gallery</title>
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
    color: #111;
    min-height: 100vh;
  }
  header {
    padding: 40px 20px 8px;
    text-align: center;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin: 0 0 18px;
  }
  .search-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 0 20px;
  }
  #q {
    width: 100%;
    font-size: 17px;
    padding: 14px 20px;
    border: 2px solid #111;
    border-radius: 999px;
    outline: none;
    background: #fff;
  }
  #q:focus { border-color: #111; box-shadow: 0 0 0 3px rgba(0,0,0,0.08); }
  #count {
    text-align: center;
    color: #666;
    font-size: 13px;
    margin: 14px 0 0;
    min-height: 18px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    padding: 18px 20px 60px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    border: 1px solid #eee;
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    background: #fafafa;
  }
  .card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }
  .card .name {
    font-size: 13px;
    padding: 8px 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty {
    text-align: center;
    color: #888;
    padding: 60px 20px;
    font-size: 15px;
    line-height: 1.6;
  }
  #lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 50;
    padding: 20px;
  }
  #lightbox.open { display: flex; }
  #lightbox img {
    max-width: 100%;
    max-height: 82vh;
    border-radius: 8px;
  }
  #lightbox .lb-name {
    color: #fff;
    margin-top: 14px;
    font-size: 15px;
  }
  #lightbox .close {
    position: absolute;
    top: 14px;
    right: 18px;
    color: #fff;
    font-size: 30px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
  }
</style>
</head>
<body>
<header><h1>Gallery</h1></header>
<div class="search-wrap">
  <input id="q" type="search" placeholder="Search by name…" autocomplete="off" enterkeyhint="search">
</div>
<div id="count"></div>
<div id="grid"></div>

<div id="lightbox">
  <button class="close" aria-label="Close">&times;</button>
  <img id="lb-img" alt="">
  <div class="lb-name" id="lb-name"></div>
</div>

<script>
let items = [];
const grid = document.getElementById('grid');
const q = document.getElementById('q');
const count = document.getElementById('count');
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbName = document.getElementById('lb-name');

function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(filter) {
  const f = filter.trim().toLowerCase();
  const hits = f
    ? items.filter(it => it.name.toLowerCase().includes(f) || it.file.toLowerCase().includes(f))
    : [];
  grid.innerHTML = '';
  if (!f) {
    count.textContent = items.length ? items.length + ' pictures saved' : '';
    grid.innerHTML = '<div class="empty">Type a name above<br>and the picture will show up.</div>';
    return;
  }
  count.textContent = hits.length + (hits.length === 1 ? ' match' : ' matches') + ' for "' + filter.trim() + '"';
  if (!hits.length) {
    grid.innerHTML = '<div class="empty">No pictures found for "' + esc(filter.trim()) + '".</div>';
    return;
  }
  for (const it of hits) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<img loading="lazy" src="images/' + encodeURIComponent(it.file) + '" alt="' + esc(it.name) + '"><div class="name">' + esc(it.name) + '</div>';
    card.onclick = () => {
      lbImg.src = 'images/' + encodeURIComponent(it.file);
      lbImg.alt = it.name;
      lbName.textContent = it.name;
      lightbox.classList.add('open');
    };
    grid.appendChild(card);
  }
}

q.addEventListener('input', () => render(q.value));
document.querySelector('#lightbox .close').onclick = () => lightbox.classList.remove('open');
lightbox.addEventListener('click', e => { if (e.target === lightbox) lightbox.classList.remove('open'); });

fetch('images/index.json?ts=' + Date.now())
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(data => { items = Array.isArray(data) ? data : []; render(q.value); })
  .catch(() => { grid.innerHTML = '<div class="empty">Could not load the gallery.</div>'; });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
